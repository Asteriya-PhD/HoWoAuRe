# 打包 Windows 安装程序（Setup.exe）
# 触发：手动（workflow_dispatch）/ 推送 v* tag
# 流程：归拢绿色包（make-win-portable.mjs）→ NSIS 打包安装程序 → 手动时上传 artifact，tag 时挂到对应 Release
name: 打包 Windows 安装程序

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 归拢 Windows 绿色包（node 便携版 + 生产依赖 + server/public）
        run: node scripts/make-win-portable.mjs

      - name: 安装 NSIS
        run: choco install nsis -y --no-progress

      - name: 编译安装程序
        shell: pwsh
        run: |
          # choco 安装后 PATH 不传播到本 step，直接用完整路径
          $nsis = @('C:\Program Files (x86)\NSIS\makensis.exe', 'C:\Program Files\NSIS\makensis.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $nsis) { throw '未找到 makensis，NSIS 可能安装失败' }
          & $nsis scripts/installer.nsi

      - name: 上传安装程序（手动触发时）
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Setup
          path: dist/HomeworkScan_*.exe
          if-no-files-found: error

      - name: 挂到 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 手动触发（main 分支）默认挂到 v1.0.0；tag 触发（v*）挂同名 Release
          $tag = if ($env:GITHUB_REF_NAME -eq 'main') { 'v1.0.0' } else { $env:GITHUB_REF_NAME }
          gh release upload $tag dist/HomeworkScan_*.exe --clobber
          Write-Host "已挂到 Release $tag"