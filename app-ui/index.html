<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>作业扫码登记</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    background: linear-gradient(165deg, #f6f9ff, #e9f1fe);
    color: #1f2937;
    display: flex; align-items: center; justify-content: center;
    -webkit-user-select: none; user-select: none;
  }
  .card { text-align: center; max-width: 620px; padding: 48px; }
  .logo {
    width: 96px; height: 96px; border-radius: 24px; margin: 0 auto 24px;
    background: linear-gradient(160deg, #5aa2f8, #2563eb);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 12px 30px rgba(37, 99, 235, .28);
  }
  .logo svg { width: 54px; height: 54px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  #status { color: #6b7280; font-size: 14px; line-height: 1.8; white-space: pre-line; }
  .spin {
    width: 26px; height: 26px; margin: 20px auto 0; border-radius: 50%;
    border: 3px solid #c7dbfa; border-top-color: #2563eb;
    animation: spin .9s linear infinite;
  }
  body.err .spin { display: none; }
  body.err #status { color: #b91c1c; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4z"/>
        <path d="M14.5 15.5l2.5 2.5 4-4.5" stroke-width="2.4"/>
      </svg>
    </div>
    <h1>作业扫码登记</h1>
    <div class="spin"></div>
    <p id="status">正在启动本地服务…</p>
  </div>
  <script>
    window.__appError = function (msg) {
      document.body.classList.add('err');
      document.getElementById('status').textContent =
        msg + '\n\n可以尝试：\n· 重新打开本应用\n· 若反复失败，检查 3000~3009 端口是否被长期占用';
    };
  </script>
</body>
</html>
